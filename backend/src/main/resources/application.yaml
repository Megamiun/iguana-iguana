spring:
  application:
    name: maplewood

  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${DB_URL:jdbc:sqlite:maplewood_school.sqlite}

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none

server:
  servlet:
    context-path: /api

# For simplicity’s sake, only discrete intervals of hours will be used.
maplewood:
  scheduling:
    time:
      available:
        - start: 9
          end: 12
        - start: 13
          end: 17
      max-consecutive-class-hours: 2
    algorithm:
      core:
        max-slack: 1
        max-combinations: 20
